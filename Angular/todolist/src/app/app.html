<div class="container">
  <h1 [ngStyle]="{ fontWeight: fontWeight, color: color }">
    {{ title }}
  </h1>
  <h2>{{ date | date : "dd/MM/yyyy" }}</h2>
  {{ tasks | slice : 0 : 1 | json }}
  <!-- Parcours du tableau d'objets littéraux de tâches -->
  <ul>
    <li
      *ngFor="let task of tasks"
      [ngClass]="{ done: task.done, 'not-done': !task.done }"
    >
      {{ task.name }}
    </li>
  </ul>

  <router-outlet />
</div>
